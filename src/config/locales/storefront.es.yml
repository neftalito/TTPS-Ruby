        paragraph_one_html: "En <strong>RecordsAR</strong> llevamos a\u00f1os conectando generaciones a trav\u00e9s de la m\u00fasica. Desde vinilos cl\u00e1sicos hasta los discos m\u00e1s modernos, nuestro cat\u00e1logo celebra cada \u00e9poca, cada artista y cada historia que la m\u00fasica tiene para contar."
        paragraph_two: "Creemos que la m\u00fasica no solo se escucha, se vive. Nuestro compromiso es preservar la experiencia \u00fanica de coleccionar y disfrutar de cada obra, haciendo que cada disco sea m\u00e1s que un producto: un viaje a la memoria y la pasi\u00f3n de quienes amamos la m\u00fasica."
